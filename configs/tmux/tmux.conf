# roost tmux config
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000

# Theme: tinted-tmux colors from the theme engine, when it is set up.
# Also theme the status bar and the active pane border.
set-environment -g TINTED_TMUX_OPTION_STATUSBAR 1
set-environment -g TINTED_TMUX_OPTION_ACTIVE 1
if-shell '[ -r ~/.local/share/tinted-theming/tinty/artifacts/tmux-colors-file.conf ]' \
  'source-file ~/.local/share/tinted-theming/tinty/artifacts/tmux-colors-file.conf'
