- defaults:
    link:
      relink: true
      create: true
    shell:
      stdout: true
      stderr: true

- clean: ['~']

- link:
    # Shell
    ~/.zprofile: configs/shell/zprofile
    ~/.zshrc: configs/shell/zshrc
    ~/.p10k.zsh: configs/shell/p10k.zsh
    ~/.config/aliases: configs/shell/aliases

    # Git
    ~/.gitconfig: configs/git/gitconfig
    ~/.gitignore: configs/git/gitignore
    ~/.config/git/delta.gitconfig:
      path: configs/git/delta.gitconfig
      if: command -v delta >/dev/null 2>&1

    # Editor
    ~/.config/nvim: configs/nvim

    # CLI Tools
    ~/.config/bat: configs/bat
    ~/.config/btop: configs/btop
    ~/.config/fastfetch: configs/fastfetch
    ~/.config/lazygit: configs/lazygit
    ~/.config/tmux: configs/tmux
    ~/.config/yazi: configs/yazi

- create:
    - ~/Desktop/Screenshots

- shell:
    - description: "Fix Oh My Zsh insecure directory permissions..."
      command: |
        if command -v brew >/dev/null 2>&1; then
          chmod go-w "$(brew --prefix)/share" 2>/dev/null || true
          chmod -R go-w "$(brew --prefix)/share/zsh" 2>/dev/null || true
        fi
      stdout: true
      stderr: true
    - description: "Seed a fallback yazi flavor until the theme engine renders one..."
      command: |
        flavor="$HOME/.config/yazi/flavors/tinty.yazi/flavor.toml"
        if [ ! -e "$flavor" ]; then
          mkdir -p "$(dirname "$flavor")"
          cp configs/yazi/flavor.fallback.toml "$flavor"
        fi
      stdout: true
      stderr: true
